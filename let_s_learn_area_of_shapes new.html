<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Let's Learn Area of Shapes! - பரப்பளவு கற்றல்</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js for Reactivity -->
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Fredoka', 'Noto Sans Tamil', sans-serif;
            overflow-x: hidden;
        }
        /* Graph paper styling */
        .graph-paper-bg {
            background-color: #f8fafc;
            background-image: 
                linear-gradient(to right, rgba(59, 130, 246, 0.18) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(59, 130, 246, 0.18) 1px, transparent 1px),
                linear-gradient(to right, rgba(59, 130, 246, 0.08) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(59, 130, 246, 0.08) 1px, transparent 1px);
            background-size: 50px 50px, 50px 50px, 10px 10px, 10px 10px;
        }
        .pulse-glow {
            animation: softPulse 2.5s infinite ease-in-out;
        }
        @keyframes softPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            opacity: 1;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-sky-50 via-indigo-50 to-amber-50 min-h-screen text-slate-800" x-data="mathLessonApp()" x-init="initApp()">

    <!-- 1. TOP HEADER & BRANDING -->
    <div class="bg-slate-900 text-white py-3 px-4 shadow-md border-b-2 border-amber-400">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-3">
            <!-- School & Creator Details -->
            <div class="flex flex-wrap items-center justify-center md:justify-start gap-3 text-xs sm:text-sm font-semibold">
                <span class="bg-amber-400 text-slate-950 px-3 py-1 rounded-full font-bold tracking-wider uppercase shadow">
                    🏫 GHS, OTTIMEDU
                </span>
                <span class="text-sky-200 flex items-center gap-1.5">
                    <span>👨‍🏫</span>
                    <span x-text="t('creatorLabel')"></span>:
                    <strong class="text-white tracking-wide">CHRISTURAJ.A, B.T.ASST. IN MATHS</strong>
                </span>
            </div>

            <!-- Language Toggle Buttons (English / தமிழ் / Bilingual) -->
            <div class="flex items-center gap-1.5 bg-slate-800 p-1 rounded-2xl border border-slate-700 shadow-inner">
                <button @click="setLang('en')" 
                    :class="lang === 'en' ? 'bg-amber-400 text-slate-950 shadow font-bold' : 'text-slate-300 hover:text-white'"
                    class="px-3 py-1.5 rounded-xl text-xs sm:text-sm transition cursor-pointer">
                    English
                </button>
                <button @click="setLang('ta')" 
                    :class="lang === 'ta' ? 'bg-amber-400 text-slate-950 shadow font-bold' : 'text-slate-300 hover:text-white'"
                    class="px-3 py-1.5 rounded-xl text-xs sm:text-sm transition cursor-pointer">
                    தமிழ்
                </button>
                <button @click="setLang('both')" 
                    :class="lang === 'both' ? 'bg-emerald-400 text-slate-950 shadow font-bold' : 'text-slate-300 hover:text-white'"
                    class="px-3 py-1.5 rounded-xl text-xs sm:text-sm transition cursor-pointer">
                    English + தமிழ்
                </button>
            </div>
        </div>
    </div>

    <!-- Main Lesson Title Banner -->
    <header class="bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 text-white shadow-xl py-5 px-4 mb-6">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="text-center md:text-left">
                <span class="bg-white/20 backdrop-blur-sm text-amber-200 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider mb-1.5 inline-block">
                    <span x-text="t('subtitleBadge')"></span>
                </span>
                <h1 class="text-2xl sm:text-4xl font-bold tracking-wide flex items-center justify-center md:justify-start gap-2.5">
                    <span>📐</span>
                    <span x-text="t('mainTitle')"></span>
                </h1>
                <p class="text-indigo-100 mt-1 text-sm sm:text-base font-medium" x-text="t('welcomeBanner')"></p>
            </div>

            <!-- Cheerful Background Music & Sound Controls -->
            <div class="flex items-center gap-2.5">
                <button @click="toggleMusic()" 
                    :class="musicPlaying ? 'bg-emerald-400 text-slate-950' : 'bg-white/20 text-white hover:bg-white/30'"
                    class="font-bold px-4 py-2.5 rounded-2xl shadow-lg transition flex items-center gap-2 text-sm cursor-pointer">
                    <span x-text="musicPlaying ? '🔊' : '🎵'"></span>
                    <span x-text="musicPlaying ? t('musicOn') : t('musicOff')"></span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Wrapper -->
    <main class="max-w-7xl mx-auto px-4 pb-16">

        <!-- Shape Selector Bar (One Shape at a Time + Revision Game) -->
        <nav class="bg-white/95 backdrop-blur-md p-3 rounded-3xl shadow-lg mb-7 flex flex-wrap gap-2 justify-center border border-indigo-100">
            <template x-for="(shape, index) in shapes" :key="shape.id">
                <button @click="selectShape(index)" 
                    :class="currentShape === index ? 'bg-indigo-600 text-white shadow-md scale-105 ring-2 ring-amber-400' : 'bg-slate-100 hover:bg-indigo-50 text-slate-700'"
                    class="px-3.5 py-2.5 rounded-2xl font-semibold text-sm transition duration-200 flex items-center gap-2 cursor-pointer">
                    <span class="text-lg" x-text="shape.icon"></span>
                    <span x-text="getShapeName(shape)"></span>
                </button>
            </template>
            
            <!-- Grand Revision Game Button -->
            <button @click="selectGame()" 
                :class="currentShape === 8 ? 'bg-pink-600 text-white shadow-md scale-105 ring-2 ring-amber-400' : 'bg-pink-100 hover:bg-pink-200 text-pink-800'"
                class="px-4 py-2.5 rounded-2xl font-bold text-sm transition duration-200 flex items-center gap-2 cursor-pointer">
                <span class="text-lg">🎮</span>
                <span x-text="t('revisionGameTab')"></span>
            </button>
        </nav>

        <!-- ================= LESSON VIEW FOR SINGLE SHAPE (0 to 7) ================= -->
        <template x-if="currentShape < 8">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-7">
                
                <!-- LEFT / MAIN COLUMN: Interactive Simulation, Graph Canvas, Real-Life Box & Steps (7 cols) -->
                <div class="lg:col-span-7 flex flex-col gap-6">

                    <!-- CARD 1: Shape Title, Direct Numeric Inputs & Interactive Canvas / Unit Grid -->
                    <div class="bg-white rounded-3xl p-6 shadow-xl border-2 border-indigo-100 relative overflow-hidden">
                        <div class="flex flex-wrap items-center justify-between gap-2 mb-4 pb-3 border-b border-slate-100">
                            <div class="flex items-center gap-3">
                                <span class="text-4xl p-3 bg-indigo-50 rounded-2xl shadow-inner" x-text="activeShape().icon"></span>
                                <div>
                                    <span class="text-xs font-bold uppercase tracking-wider text-indigo-500" x-text="t('shapeStepLabel') + ' ' + (currentShape + 1) + ' / 8'"></span>
                                    <h2 class="text-2xl sm:text-3xl font-bold text-indigo-950" x-text="getShapeName(activeShape())"></h2>
                                </div>
                            </div>
                            <button @click="replayAnimation()" class="bg-amber-100 hover:bg-amber-200 text-amber-900 font-bold px-3.5 py-2 rounded-2xl text-xs sm:text-sm flex items-center gap-1.5 shadow-sm transition cursor-pointer">
                                <span>🔄</span> <span x-text="t('replayAnimBtn')"></span>
                            </button>
                        </div>

                        <!-- Direct Numeric Input Boxes (No Sliders) -->
                        <div class="bg-indigo-50/80 p-4 rounded-2xl border border-indigo-200 mb-5">
                            <div class="text-xs font-bold uppercase tracking-wider text-indigo-800 mb-3 flex items-center gap-1.5">
                                <span>⌨️</span> <span x-text="t('enterDimensionsTitle')"></span>
                            </div>
                            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                                <template x-for="(dim, key) in activeShape().dimensions" :key="key">
                                    <div class="bg-white p-3 rounded-2xl border-2 border-indigo-100 shadow-sm flex flex-col gap-1">
                                        <label class="text-xs font-bold text-slate-600" x-text="getDimLabel(dim)"></label>
                                        <div class="flex items-center gap-2">
                                            <input type="number" 
                                                :min="dim.min" 
                                                :max="dim.max" 
                                                step="1"
                                                x-model.number="dim.val" 
                                                @input="onDimensionChange(key)"
                                                class="w-full px-3 py-2 border-2 border-indigo-300 rounded-xl font-bold text-lg text-center text-indigo-950 bg-indigo-50/50 focus:outline-none focus:border-indigo-600">
                                            <span class="text-sm font-bold text-slate-500" x-text="t('cmUnit')"></span>
                                        </div>
                                        <span class="text-[11px] text-slate-400" x-text="t('allowedRange') + ': ' + dim.min + ' - ' + dim.max"></span>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <!-- CONDITIONAL VISUALIZATION: -->
                        <!-- CASE A: SQUARE (0) & RECTANGLE (1) -> Strict Unit-Square Grid (NO NUMBERS inside squares) + Dimension Labels -->
                        <template x-if="currentShape === 0 || currentShape === 1">
                            <div class="bg-slate-900 rounded-3xl p-5 shadow-inner flex flex-col items-center justify-center relative">
                                <div class="w-full flex items-center justify-between text-xs text-amber-300 font-bold mb-3 px-2">
                                    <span x-text="t('unitSquareTitle')"></span>
                                    <span class="bg-slate-800 px-2.5 py-1 rounded-full text-emerald-300" x-text="t('noNumbersHint')"></span>
                                </div>

                                <!-- Visual Container with Side Labels -->
                                <div class="flex flex-col items-center justify-center my-2 w-full overflow-x-auto py-2">
                                    <!-- Top Dimension Label -->
                                    <div class="text-amber-300 font-bold text-sm mb-2 bg-slate-800 px-3 py-1 rounded-full border border-amber-400/40">
                                        <span x-text="currentShape === 0 ? (t('sideWord') + ' = ' + activeShape().dimensions.side.val + ' ' + t('cmUnit')) : (t('lengthWord') + ' = ' + activeShape().dimensions.length.val + ' ' + t('cmUnit'))"></span>
                                    </div>

                                    <div class="flex items-center gap-3">
                                        <!-- Left Dimension Label -->
                                        <div class="text-sky-300 font-bold text-sm bg-slate-800 px-3 py-1 rounded-full border border-sky-400/40 whitespace-nowrap">
                                            <span x-text="currentShape === 0 ? (t('sideWord') + ' = ' + activeShape().dimensions.side.val + ' ' + t('cmUnit')) : (t('breadthWord') + ' = ' + activeShape().dimensions.breadth.val + ' ' + t('cmUnit'))"></span>
                                        </div>

                                        <!-- Strict Unit Square Grid (NO NUMBERS INSIDE) -->
                                        <div class="p-2.5 bg-slate-950 rounded-2xl border-4 border-amber-400 shadow-[0_0_20px_rgba(250,204,21,0.3)]">
                                            <div class="grid gap-1.5" :style="getStrictRectGridStyle()">
                                                <template x-for="cell in getStrictRectCellCount()" :key="cell">
                                                    <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-lg transition-all duration-300 shadow-sm"
                                                        :class="currentShape === 0 ? 'bg-gradient-to-br from-amber-300 to-amber-500 border border-amber-200' : 'bg-gradient-to-br from-sky-400 to-blue-600 border border-sky-200'">
                                                    </div>
                                                </template>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <p class="text-xs text-slate-300 text-center mt-3 bg-slate-800/80 px-4 py-2 rounded-xl" x-text="getVisualProofCaption()"></p>
                            </div>
                        </template>

                        <!-- CASE B: ALL OTHER 6 SHAPES (2 to 7) -> Graph Sheet Background Canvas with Accurate Scaled Dimensions & Visual Proof Animation -->
                        <template x-if="currentShape >= 2">
                            <div class="rounded-3xl p-4 border-2 border-blue-200 bg-blue-50/40 shadow-inner">
                                <div class="flex flex-wrap items-center justify-between gap-2 mb-2 px-1">
                                    <span class="text-xs font-bold text-blue-900 flex items-center gap-1.5">
                                        <span>📊</span> <span x-text="t('graphSheetTitle')"></span>
                                    </span>
                                    <span class="text-xs font-semibold text-indigo-700 bg-white px-2.5 py-1 rounded-full border border-indigo-200" x-text="t('graphScaleNote')"></span>
                                </div>

                                <!-- HTML5 Graph Paper Canvas -->
                                <div class="w-full rounded-2xl overflow-hidden border-2 border-blue-300 shadow-md graph-paper-bg relative">
                                    <canvas id="mainGraphCanvas" class="w-full h-[310px] block"></canvas>
                                </div>

                                <!-- Visual Proof Explanation Caption -->
                                <div class="mt-3 bg-white p-3 rounded-2xl border border-blue-100 text-xs sm:text-sm font-medium text-slate-700 flex items-center gap-2.5 shadow-sm">
                                    <span class="text-xl">💡</span>
                                    <span x-text="getVisualProofCaption()"></span>
                                </div>
                            </div>
                        </template>
                    </div>

                    <!-- CARD 2: LARGE REAL-LIFE EXAMPLE BOX -->
                    <div class="bg-gradient-to-br from-amber-50 via-orange-50 to-yellow-50 rounded-3xl p-6 shadow-xl border-2 border-amber-300">
                        <div class="flex items-center justify-between mb-3">
                            <span class="bg-amber-500 text-white text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider shadow-sm" x-text="t('realLifeBadge')"></span>
                            <span class="text-xs font-bold text-amber-800" x-text="getShapeName(activeShape())"></span>
                        </div>

                        <div class="flex flex-col sm:flex-row items-center gap-5 bg-white/90 p-5 rounded-2xl border border-amber-200 shadow-sm">
                            <!-- Large Illustrated SVG Real-Life Object -->
                            <div class="w-32 h-32 sm:w-36 sm:h-36 flex-shrink-0 bg-amber-100/70 rounded-3xl flex items-center justify-center p-3 border-2 border-amber-300 shadow-inner pulse-glow" x-html="activeShape().realLifeSvg">
                            </div>

                            <div class="flex-1 text-center sm:text-left">
                                <h3 class="text-xl sm:text-2xl font-bold text-amber-950 mb-1" x-text="getRealLifeTitle(activeShape())"></h3>
                                <p class="text-sm sm:text-base text-slate-700 leading-relaxed mb-3" x-text="getRealLifeDesc(activeShape())"></p>
                                <div class="inline-flex items-center gap-2 bg-amber-100 text-amber-900 font-bold text-xs sm:text-sm px-3.5 py-2 rounded-xl border border-amber-300">
                                    <span>📏</span>
                                    <span x-text="getStep1Measurements()"></span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- CARD 3: 5-STEP AREA CALCULATION BREAKDOWN -->
                    <div class="bg-gradient-to-br from-indigo-700 via-indigo-800 to-purple-900 text-white rounded-3xl p-6 shadow-xl">
                        <h3 class="text-xl font-bold mb-4 flex items-center gap-2">
                            <span>🧮</span> <span x-text="t('fiveStepsHeading')"></span>
                        </h3>

                        <div class="flex flex-col gap-3 text-sm sm:text-base">
                            <!-- Step 1 -->
                            <div class="bg-white/10 backdrop-blur-sm p-3.5 rounded-2xl border border-white/15 flex items-start gap-3">
                                <span class="bg-amber-400 text-slate-950 font-bold px-3 py-1 rounded-full text-xs whitespace-nowrap mt-0.5" x-text="t('stepWord') + ' 1'"></span>
                                <div>
                                    <div class="font-bold text-amber-300 text-xs uppercase tracking-wider" x-text="t('step1Title')"></div>
                                    <div class="font-semibold text-white mt-0.5" x-text="getStep1Measurements()"></div>
                                </div>
                            </div>

                            <!-- Step 2 -->
                            <div class="bg-white/10 backdrop-blur-sm p-3.5 rounded-2xl border border-white/15 flex items-start gap-3">
                                <span class="bg-amber-400 text-slate-950 font-bold px-3 py-1 rounded-full text-xs whitespace-nowrap mt-0.5" x-text="t('stepWord') + ' 2'"></span>
                                <div>
                                    <div class="font-bold text-amber-300 text-xs uppercase tracking-wider" x-text="t('step2Title')"></div>
                                    <div class="font-bold text-lg text-emerald-300 mt-0.5" x-text="getFormulaDisplay(activeShape())"></div>
                                </div>
                            </div>

                            <!-- Step 3 -->
                            <div class="bg-white/10 backdrop-blur-sm p-3.5 rounded-2xl border border-white/15 flex items-start gap-3">
                                <span class="bg-amber-400 text-slate-950 font-bold px-3 py-1 rounded-full text-xs whitespace-nowrap mt-0.5" x-text="t('stepWord') + ' 3'"></span>
                                <div>
                                    <div class="font-bold text-amber-300 text-xs uppercase tracking-wider" x-text="t('step3Title')"></div>
                                    <div class="font-semibold text-white mt-0.5" x-text="getStep3Substitution()"></div>
                                </div>
                            </div>

                            <!-- Step 4 -->
                            <div class="bg-white/10 backdrop-blur-sm p-3.5 rounded-2xl border border-white/15 flex items-start gap-3">
                                <span class="bg-amber-400 text-slate-950 font-bold px-3 py-1 rounded-full text-xs whitespace-nowrap mt-0.5" x-text="t('stepWord') + ' 4'"></span>
                                <div>
                                    <div class="font-bold text-amber-300 text-xs uppercase tracking-wider" x-text="t('step4Title')"></div>
                                    <div class="font-semibold text-white mt-0.5" x-text="getStep4Arithmetic()"></div>
                                </div>
                            </div>

                            <!-- Step 5 -->
                            <div class="bg-amber-400 text-slate-950 p-4 rounded-2xl font-bold flex flex-wrap items-center justify-between gap-2 shadow-lg">
                                <div class="flex items-center gap-2">
                                    <span class="bg-slate-900 text-amber-300 px-3 py-1 rounded-full text-xs" x-text="t('stepWord') + ' 5'"></span>
                                    <span x-text="t('step5Title')"></span>
                                </div>
                                <div class="bg-indigo-950 text-amber-300 px-4 py-1.5 rounded-xl text-lg sm:text-xl tracking-wide shadow">
                                    <span x-text="computeArea() + ' ' + t('sqCmUnit')"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- RIGHT COLUMN: Golden Formula (Repeated 3x) & Practice Zone with Labeled Geometric Diagram (5 cols) -->
                <div class="lg:col-span-5 flex flex-col gap-6">

                    <!-- CARD 4: GOLDEN FORMULA REPEATED 3 TIMES -->
                    <div class="bg-white rounded-3xl p-6 shadow-xl border-2 border-amber-300">
                        <div class="flex items-center gap-2.5 mb-2">
                            <span class="text-2xl">🌟</span>
                            <h3 class="text-xl font-bold text-amber-950" x-text="t('goldenFormulaHeading')"></h3>
                        </div>
                        <p class="text-xs text-slate-500 mb-3" x-text="t('repeatThreeNote')"></p>

                        <div class="flex flex-col gap-2.5">
                            <template x-for="rep in [1, 2, 3]" :key="rep">
                                <div class="bg-gradient-to-r from-amber-50 to-yellow-50 border-l-4 border-amber-500 p-3 rounded-r-2xl shadow-sm flex items-center justify-between gap-2">
                                    <span class="font-bold text-base sm:text-lg text-amber-950" x-text="rep + '. ' + getFormulaDisplay(activeShape())"></span>
                                    <span class="bg-amber-200 text-amber-900 text-[11px] font-bold px-2.5 py-0.5 rounded-full whitespace-nowrap" x-text="'× ' + rep"></span>
                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- CARD 5: PRACTICE ZONE (NO ANIMATION/GRID — CRISP STATIC LABELED DIAGRAM + 2 SEPARATE INPUTS & CHECK BUTTONS) -->
                    <div class="bg-white rounded-3xl p-6 shadow-xl border-2 border-emerald-200 flex-1 flex flex-col justify-between">
                        <div>
                            <!-- Practice Header & Question Switcher -->
                            <div class="flex items-center justify-between gap-2 mb-3">
                                <h3 class="text-xl font-bold text-emerald-950 flex items-center gap-2">
                                    <span>✍️</span> <span x-text="t('practiceZoneHeading')"></span>
                                </h3>
                                <div class="flex items-center gap-1.5 bg-emerald-100 p-1 rounded-xl">
                                    <button @click="setPracticeQuestion(0)" 
                                        :class="practiceIdx === 0 ? 'bg-emerald-600 text-white shadow' : 'text-emerald-900 hover:bg-emerald-200'"
                                        class="px-2.5 py-1 rounded-lg text-xs font-bold transition cursor-pointer">
                                        Q1
                                    </button>
                                    <button @click="setPracticeQuestion(1)" 
                                        :class="practiceIdx === 1 ? 'bg-emerald-600 text-white shadow' : 'text-emerald-900 hover:bg-emerald-200'"
                                        class="px-2.5 py-1 rounded-lg text-xs font-bold transition cursor-pointer">
                                        Q2
                                    </button>
                                </div>
                            </div>

                            <!-- Practice Question Prompt -->
                            <div class="bg-emerald-50 border border-emerald-200 p-4 rounded-2xl mb-4">
                                <span class="text-[11px] font-bold uppercase tracking-wider text-emerald-700 block mb-1" x-text="t('questionLabel') + ' ' + (practiceIdx + 1) + ' / 2'"></span>
                                <p class="font-bold text-emerald-950 text-base leading-snug" x-text="getPracticeQuestionText()"></p>
                            </div>

                            <!-- STATIC LABELED GEOMETRIC DIAGRAM FOR THE PRACTICE QUESTION -->
                            <div class="bg-slate-50 border-2 border-slate-200 rounded-2xl p-3 mb-4 flex flex-col items-center">
                                <span class="text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1" x-text="t('practiceDiagramLabel')"></span>
                                <div class="w-full flex items-center justify-center" x-html="getPracticeDiagramSvg()"></div>
                            </div>

                            <!-- 5-SECOND THINKING TIMER -->
                            <div class="mb-4">
                                <template x-if="timerRunning">
                                    <div class="bg-amber-100 border-2 border-amber-300 text-amber-950 p-3 rounded-2xl text-center font-bold">
                                        <div class="text-sm mb-1.5" x-text="t('thinkTimerMsg').replace('{sec}', timerSec)"></div>
                                        <div class="w-full bg-amber-200 h-2.5 rounded-full overflow-hidden">
                                            <div class="bg-amber-600 h-full transition-all duration-1000" :style="'width: ' + (timerSec * 20) + '%'"></div>
                                        </div>
                                    </div>
                                </template>

                                <template x-if="!timerRunning && !answerRevealed">
                                    <button @click="startThinkTimer()" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2.5 px-4 rounded-2xl shadow transition flex items-center justify-center gap-2 text-sm cursor-pointer">
                                        <span>⏳</span> <span x-text="t('startTimerBtn')"></span>
                                    </button>
                                </template>

                                <template x-if="answerRevealed">
                                    <div class="bg-indigo-50 border-2 border-indigo-200 p-3.5 rounded-2xl">
                                        <div class="text-xs font-bold text-indigo-600 uppercase mb-1" x-text="t('revealedSolutionLabel')"></div>

                initApp() {
                    this.buildRevisionGame();
                    setInterval(() => {
                        this.animProgress += 0.015 * this.animDirection;
                        if (this.animProgress >= 1) {
                            this.animProgress = 1;
                            this.animDirection = -1;
                        } else if (this.animProgress <= 0) {
                            this.animProgress = 0;
                            this.animDirection = 1;
                        }
                        if (this.currentShape >= 2 && this.currentShape < 8) {
                            this.drawGraphCanvas();
                        }
                    }, 45);
                },

                t(key) {
                    const entry = this.i18n[key];
                    if (!entry) return key;
                    return entry[this.lang] || entry.both;
                },

                setLang(newLang) {
                    this.lang = newLang;
                    this.$nextTick(() => {
                        if (this.currentShape >= 2 && this.currentShape < 8) {
                            this.drawGraphCanvas();
                        }
                    });
                },

                activeShape() {
                    return this.shapes[this.currentShape];
                },

                getShapeName(shape) {
                    if (this.lang === 'en') return shape.nameEn;
                    if (this.lang === 'ta') return shape.nameTa;
                    return `${shape.nameEn} (${shape.nameTa})`;
                },

                getDimLabel(dim) {
                    if (this.lang === 'en') return dim.labelEn;
                    if (this.lang === 'ta') return dim.labelTa;
                    return `${dim.labelEn} / ${dim.labelTa}`;
                },

                getRealLifeTitle(shape) {
                    if (this.lang === 'en') return shape.realLifeEn;
                    if (this.lang === 'ta') return shape.realLifeTa;
                    return shape.realLifeEn;
                },

                getRealLifeDesc(shape) {
                    if (this.lang === 'en') return shape.realLifeDescEn;
                    if (this.lang === 'ta') return shape.realLifeDescTa;
                    return `${shape.realLifeDescEn} ${shape.realLifeDescTa}`;
                },

                getFormulaDisplay(shape) {
                    if (this.lang === 'en') return shape.formulaEn;
                    if (this.lang === 'ta') return shape.formulaTa;
                    return `${shape.formulaEn}  |  ${shape.formulaTa}`;
                },

                getVisualProofCaption() {
                    const s = this.activeShape();
                    if (this.lang === 'en') return s.visualCaptionEn;
                    if (this.lang === 'ta') return s.visualCaptionTa;
                    return `${s.visualCaptionEn} (${s.visualCaptionTa})`;
                },

                selectShape(idx) {
                    this.currentShape = idx;
                    this.practiceIdx = 0;
                    this.resetPracticeState();
                    this.replayAnimation();
                    this.$nextTick(() => {
                        if (idx >= 2 && idx < 8) this.drawGraphCanvas();
                    });
                },

                selectGame() {
                    this.currentShape = 8;
                    this.celebrate();
                },

                replayAnimation() {
                    this.animProgress = 0;
                    this.animDirection = 1;
                    if (this.currentShape >= 2 && this.currentShape < 8) {
                        this.drawGraphCanvas();
                    }
                },

                onDimensionChange(key) {
                    const d = this.activeShape().dimensions[key];
                    if (isNaN(d.val) || d.val < d.min) d.val = d.min;
                    if (d.val > d.max) d.val = d.max;
                    if (this.currentShape >= 2 && this.currentShape < 8) {
                        this.drawGraphCanvas();
                    }
                },

                // Strict Unit Square Grid Helpers (ONLY for Square & Rectangle, NO numbers inside squares)
                getStrictRectGridStyle() {
                    const d = this.activeShape().dimensions;
                    const cols = this.currentShape === 0 ? d.side.val : d.length.val;
                    return `grid-template-columns: repeat(${cols}, minmax(0, 1fr));`;
                },

                getStrictRectCellCount() {
                    const d = this.activeShape().dimensions;
                    if (this.currentShape === 0) return d.side.val * d.side.val;
                    return d.length.val * d.breadth.val;
                },

                // 5-Step Calculation Generators
                getStep1Measurements() {
                    const d = this.activeShape().dimensions;
                    const idx = this.currentShape;
                    const u = this.t('cmUnit');
                    if (idx === 0) return `${this.t('sideWord')} (s) = ${d.side.val} ${u}`;
                    if (idx === 1) return `${this.t('lengthWord')} (l) = ${d.length.val} ${u}, ${this.t('breadthWord')} (b) = ${d.breadth.val} ${u}`;
                    if (idx === 2 || idx === 3) return `Base (b) = ${d.base.val} ${u}, Height (h) = ${d.height.val} ${u}`;
                    if (idx === 4) return `a = ${d.a.val} ${u}, b = ${d.b.val} ${u}, Height (h) = ${d.h.val} ${u}`;
                    if (idx === 5) return `Radius (r) = ${d.radius.val} ${u}`;
                    return `d₁ = ${d.d1.val} ${u}, d₂ = ${d.d2.val} ${u}`;
                },

                getStep3Substitution() {
                    const d = this.activeShape().dimensions;
                    const idx = this.currentShape;
                    if (idx === 0) return `${d.side.val} × ${d.side.val}`;
                    if (idx === 1) return `${d.length.val} × ${d.breadth.val}`;
                    if (idx === 2) return `½ × ${d.base.val} × ${d.height.val}`;
                    if (idx === 3) return `${d.base.val} × ${d.height.val}`;
                    if (idx === 4) return `½ × (${d.a.val} + ${d.b.val}) × ${d.h.val}`;
                    if (idx === 5) return `(22 / 7) × ${d.radius.val} × ${d.radius.val}`;
                    return `½ × ${d.d1.val} × ${d.d2.val}`;
                },

                getStep4Arithmetic() {
                    const d = this.activeShape().dimensions;
                    const idx = this.currentShape;
                    if (idx === 0) return `${d.side.val} × ${d.side.val} = ${d.side.val * d.side.val}`;
                    if (idx === 1) return `${d.length.val} × ${d.breadth.val} = ${d.length.val * d.breadth.val}`;
                    if (idx === 2) return `½ × (${d.base.val * d.height.val}) = ${0.5 * d.base.val * d.height.val}`;
                    if (idx === 3) return `${d.base.val} × ${d.height.val} = ${d.base.val * d.height.val}`;
                    if (idx === 4) {
                        const sum = d.a.val + d.b.val;
                        return `½ × ${sum} × ${d.h.val} = ${0.5 * sum * d.h.val}`;
                    }
                    if (idx === 5) {
                        const r2 = d.radius.val * d.radius.val;
                        const res = ((22 / 7) * r2).toFixed(2).replace(/\.00$/, '');
                        return `(22 / 7) × ${r2} = ${res}`;
                    }
                    return `½ × (${d.d1.val * d.d2.val}) = ${0.5 * d.d1.val * d.d2.val}`;
                },

                computeArea() {
                    const d = this.activeShape().dimensions;
                    const idx = this.currentShape;
                    if (idx === 0) return d.side.val * d.side.val;
                    if (idx === 1) return d.length.val * d.breadth.val;
                    if (idx === 2) return 0.5 * d.base.val * d.height.val;
                    if (idx === 3) return d.base.val * d.height.val;
                    if (idx === 4) return 0.5 * (d.a.val + d.b.val) * d.h.val;
                    if (idx === 5) return ((22 / 7) * d.radius.val * d.radius.val).toFixed(2).replace(/\.00$/, '');
                    return 0.5 * d.d1.val * d.d2.val;
                },

                // Graph Sheet Canvas Drawing for Shapes 2 to 7 (Accurately Scaled + Visual Proof + Measurement Labels)
                drawGraphCanvas() {
                    const canvas = document.getElementById('mainGraphCanvas');
                    if (!canvas) return;
                    const ctx = canvas.getContext('2d');
                    const rect = canvas.getBoundingClientRect();
                    canvas.width = rect.width || 560;
                    canvas.height = 310;

                    const W = canvas.width;
                    const H = canvas.height;
                    ctx.clearRect(0, 0, W, H);

                    // Scale factor: 1 cm = 24 px
                    const scale = 24;
                    const cx = W / 2;
                    const cy = H / 2 + 10;
                    const idx = this.currentShape;
                    const d = this.activeShape().dimensions;
                    const u = this.lang === 'ta' ? 'செ.மீ' : 'cm';

                    ctx.save();
                    ctx.font = 'bold 14px Fredoka, Noto Sans Tamil, sans-serif';
                    ctx.textAlign = 'center';

                    if (idx === 2) {
                        // TRIANGLE: Scaled Base & Height + Ghost Duplicate Triangle Forming Rectangle
                        const bw = d.base.val * scale;
                        const hh = d.height.val * scale;
                        const x0 = cx - bw / 2;
                        const y0 = cy + hh / 2;

                        // Animated Twin Triangle (visual proof of 1/2 rectangle)
                        const slideOffset = (1 - this.animProgress) * 45;
                        ctx.save();
                        ctx.translate(slideOffset, -slideOffset * 0.6);
                        ctx.fillStyle = 'rgba(251, 191, 36, 0.28)';
                        ctx.strokeStyle = '#d97706';
                        ctx.setLineDash([5, 5]);
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.moveTo(cx, y0 - hh);
                        ctx.lineTo(x0 + bw, y0 - hh);
                        ctx.lineTo(x0 + bw, y0);
                        ctx.closePath();
                        ctx.fill();
                        ctx.stroke();
                        ctx.restore();

                        // Primary Triangle
                        ctx.fillStyle = 'rgba(34, 197, 94, 0.45)';
                        ctx.strokeStyle = '#15803d';
                        ctx.lineWidth = 3.5;
                        ctx.beginPath();
                        ctx.moveTo(x0, y0);
                        ctx.lineTo(x0 + bw, y0);
                        ctx.lineTo(cx, y0 - hh);
                        ctx.closePath();
                        ctx.fill();
                        ctx.stroke();

                        // Height Dashed Line
                        ctx.strokeStyle = '#dc2626';
                        ctx.setLineDash([5, 4]);
                        ctx.lineWidth = 2.5;
                        ctx.beginPath();
                        ctx.moveTo(cx, y0 - hh);
                        ctx.lineTo(cx, y0);
                        ctx.stroke();
                        ctx.setLineDash([]);

                        // Measurement Labels
                        ctx.fillStyle = '#0f172a';
                        ctx.fillText(`Base (b) = ${d.base.val} ${u}`, cx, y0 + 22);
                        ctx.fillStyle = '#dc2626';
                        ctx.fillText(`h = ${d.height.val} ${u}`, cx + 45, y0 - hh / 2);

                    } else if (idx === 3) {
                        // PARALLELOGRAM: Scaled Base & Height + Left Triangle Slicing & Sliding to Right
                        const bw = d.base.val * scale;
                        const hh = d.height.val * scale;
                        const skew = 36;
                        const x0 = cx - bw / 2 - skew / 2;
                        const y0 = cy + hh / 2;

                        // Main Parallelogram
                        ctx.fillStyle = 'rgba(249, 115, 22, 0.42)';
                        ctx.strokeStyle = '#c2410c';
                        ctx.lineWidth = 3.5;
                        ctx.beginPath();
                        ctx.moveTo(x0, y0);
                        ctx.lineTo(x0 + bw, y0);
                        ctx.lineTo(x0 + bw + skew, y0 - hh);
                        ctx.lineTo(x0 + skew, y0 - hh);
                        ctx.closePath();
                        ctx.fill();
                        ctx.stroke();

                        // Animated Sliced Triangle Moving to Right Side
                        const moveX = this.animProgress * bw;
                        ctx.fillStyle = 'rgba(59, 130, 246, 0.35)';
                        ctx.strokeStyle = '#2563eb';
                        ctx.setLineDash([5, 4]);
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.moveTo(x0 + moveX, y0);
                        ctx.lineTo(x0 + skew + moveX, y0);
                        ctx.lineTo(x0 + skew + moveX, y0 - hh);
                        ctx.closePath();
                        ctx.fill();
                        ctx.stroke();
                        ctx.setLineDash([]);

                        // Height Line
                        ctx.strokeStyle = '#dc2626';
                        ctx.lineWidth = 2.5;
                        ctx.beginPath();
                        ctx.moveTo(x0 + skew, y0 - hh);
                        ctx.lineTo(x0 + skew, y0);
                        ctx.stroke();

                        ctx.fillStyle = '#0f172a';
                        ctx.fillText(`Base (b) = ${d.base.val} ${u}`, x0 + bw / 2, y0 + 22);
                        ctx.fillStyle = '#dc2626';
                        ctx.fillText(`h = ${d.height.val} ${u}`, x0 + skew + 42, y0 - hh / 2);

                    } else if (idx === 4) {
                        // TRAPEZOID: Scaled Top Base (a), Bottom Base (b), Height (h)
                        const topW = d.a.val * scale;
                        const botW = d.b.val * scale;
                        const hh = d.h.val * scale;
                        const yBot = cy + hh / 2;
                        const yTop = cy - hh / 2;

                        ctx.fillStyle = 'rgba(168, 85, 247, 0.42)';
                        ctx.strokeStyle = '#7e22ce';
                        ctx.lineWidth = 3.5;
                        ctx.beginPath();
                        ctx.moveTo(cx - botW / 2, yBot);
                        ctx.lineTo(cx + botW / 2, yBot);
                        ctx.lineTo(cx + topW / 2, yTop);
                        ctx.lineTo(cx - topW / 2, yTop);
                        ctx.closePath();
                        ctx.fill();
                        ctx.stroke();

                        // Animated Midline Average Highlight
                        const midW = ((topW + botW) / 2) * (0.6 + 0.4 * this.animProgress);
                        ctx.strokeStyle = '#f59e0b';
                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        ctx.moveTo(cx - midW / 2, cy);
                        ctx.lineTo(cx + midW / 2, cy);
                        ctx.stroke();

                        // Height Line
                        ctx.strokeStyle = '#dc2626';
                        ctx.setLineDash([5, 4]);
                        ctx.lineWidth = 2.5;
                        ctx.beginPath();
                        ctx.moveTo(cx - topW / 2, yTop);
                        ctx.lineTo(cx - topW / 2, yBot);
                        ctx.stroke();
                        ctx.setLineDash([]);

                        ctx.fillStyle = '#6b21a8';
                        ctx.fillText(`a = ${d.a.val} ${u}`, cx, yTop - 10);
                        ctx.fillStyle = '#0f172a';
                        ctx.fillText(`b = ${d.b.val} ${u}`, cx, yBot + 22);
                        ctx.fillStyle = '#dc2626';
                        ctx.fillText(`h = ${d.h.val} ${u}`, cx - topW / 2 + 40, cy + 4);

                    } else if (idx === 5) {
                        // CIRCLE: Scaled Radius (r) with Animated Radial Sector Sweep
                        const rPx = Math.min(d.radius.val * 15, 115);

                        // Full Circle
                        ctx.fillStyle = 'rgba(239, 68, 68, 0.35)';
                        ctx.strokeStyle = '#dc2626';
                        ctx.lineWidth = 3.5;
                        ctx.beginPath();
                        ctx.arc(cx, cy - 8, rPx, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.stroke();

                        // Animated Sweeping Sector
                        ctx.fillStyle = 'rgba(250, 204, 21, 0.45)';
                        ctx.beginPath();
                        ctx.moveTo(cx, cy - 8);
                        ctx.arc(cx, cy - 8, rPx, 0, Math.PI * 2 * this.animProgress);
                        ctx.closePath();
                        ctx.fill();

                        // Radius Line
                        ctx.strokeStyle = '#0f172a';
                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        ctx.moveTo(cx, cy - 8);
                        ctx.lineTo(cx + rPx, cy - 8);
                        ctx.stroke();

                        // Center Dot
                        ctx.fillStyle = '#0f172a';
                        ctx.beginPath();
                        ctx.arc(cx, cy - 8, 4, 0, Math.PI * 2);
                        ctx.fill();

                        ctx.fillStyle = '#991b1b';
                        ctx.fillText(`Radius (r) = ${d.radius.val} ${u}`, cx + rPx / 2, cy - 18);

                    } else if (idx === 6 || idx === 7) {
                        // RHOMBUS (6) & KITE (7): Scaled Diagonals d1 & d2 + Bounding Rectangle Proof
                        const d1Px = Math.min(d.d1.val * 20, 220);
                        const d2Px = Math.min(d.d2.val * 20, 220);

                        // Bounding Rectangle (Visual Proof of 1/2 d1 * d2)
                        ctx.strokeStyle = `rgba(59, 130, 246, ${0.25 + 0.55 * this.animProgress})`;
                        ctx.setLineDash([6, 4]);
                        ctx.lineWidth = 2;
                        if (idx === 6) {
                            ctx.strokeRect(cx - d1Px / 2, cy - d2Px / 2 - 6, d1Px, d2Px);
                        } else {
                            ctx.strokeRect(cx - d2Px / 2, cy - d1Px / 2 - 6, d2Px, d1Px);
                        }
                        ctx.setLineDash([]);

                        ctx.beginPath();
                        if (idx === 6) {
                            // Rhombus symmetric diagonals
                            ctx.moveTo(cx, cy - d2Px / 2 - 6);
                            ctx.lineTo(cx + d1Px / 2, cy - 6);
                            ctx.lineTo(cx, cy + d2Px / 2 - 6);
                            ctx.lineTo(cx - d1Px / 2, cy - 6);
                        } else {
                            // Kite asymmetric vertical diagonal d1 and horizontal d2
                            const topPart = d1Px * 0.35;
                            const botPart = d1Px * 0.65;
                            ctx.moveTo(cx, cy - topPart - 6);
                            ctx.lineTo(cx + d2Px / 2, cy - 6);
                            ctx.lineTo(cx, cy + botPart - 6);
                            ctx.lineTo(cx - d2Px / 2, cy - 6);
                        }
                        ctx.closePath();
                        ctx.fillStyle = idx === 6 ? 'rgba(20, 184, 166, 0.42)' : 'rgba(244, 63, 94, 0.42)';
                        ctx.strokeStyle = idx === 6 ? '#0f766e' : '#be123c';
                        ctx.lineWidth = 3.5;
                        ctx.fill();
                        ctx.stroke();

                        // Draw Diagonals Inside
                        ctx.strokeStyle = '#1e293b';
                        ctx.setLineDash([4, 4]);
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        if (idx === 6) {
                            ctx.moveTo(cx - d1Px / 2, cy - 6);
                            ctx.lineTo(cx + d1Px / 2, cy - 6);
                            ctx.moveTo(cx, cy - d2Px / 2 - 6);
                            ctx.lineTo(cx, cy + d2Px / 2 - 6);
                        } else {
                            const topPart = d1Px * 0.35;
                            const botPart = d1Px * 0.65;
                            ctx.moveTo(cx - d2Px / 2, cy - 6);
                            ctx.lineTo(cx + d2Px / 2, cy - 6);
                            ctx.moveTo(cx, cy - topPart - 6);
                            ctx.lineTo(cx, cy + botPart - 6);
                        }
                        ctx.stroke();
                        ctx.setLineDash([]);

                        ctx.fillStyle = '#0f172a';
                        ctx.fillText(`d₁ = ${d.d1.val} ${u}  |  d₂ = ${d.d2.val} ${u}`, cx, H - 14);
                    }

                    ctx.restore();
                },

                // Practice Zone Methods
                getPracticeQuestionText() {
                    const p = this.activeShape().practice[this.practiceIdx];
                    if (this.lang === 'en') return p.qEn;
                    if (this.lang === 'ta') return p.qTa;
                    return `${p.qEn} (${p.qTa})`;
                },

                getPracticeDiagramSvg() {
                    return this.activeShape().practice[this.practiceIdx].svg;
                },

                getPracticeRevealedSolution() {
                    const p = this.activeShape().practice[this.practiceIdx];
                    if (this.lang === 'en') return p.solEn;
                    if (this.lang === 'ta') return p.solTa;
                    return `${p.solEn}  |  ${p.solTa}`;
                },

                setPracticeQuestion(qIdx) {
                    this.practiceIdx = qIdx;
                    this.resetPracticeState();
                },

                nextPracticeQuestion() {
                    this.practiceIdx = (this.practiceIdx + 1) % 2;
                    this.resetPracticeState();
                },

                nextShape() {
                    if (this.currentShape < 7) {
                        this.selectShape(this.currentShape + 1);
                    } else {
                        this.selectGame();
                    }
                },

                resetPracticeState() {
                    this.userFormulaInput = '';
                    this.userAnswerInput = '';
                    this.formulaStatusMsg = '';
                    this.formulaIsOk = false;
                    this.answerStatusMsg = '';
                    this.answerIsOk = false;
                    this.timerRunning = false;
                    this.timerSec = 5;
                    this.answerRevealed = false;
                    if (this.timerHandle) clearInterval(this.timerHandle);
                },

                startThinkTimer() {
                    this.timerRunning = true;
                    this.timerSec = 5;
                    if (this.timerHandle) clearInterval(this.timerHandle);
                    this.timerHandle = setInterval(() => {
                        this.timerSec--;
                        if (this.timerSec <= 0) {
                            clearInterval(this.timerHandle);
                            this.timerRunning = false;
                            this.answerRevealed = true;
                            this.playChime([523.25, 659.25]);
                        }
                    }, 1000);
                },

                checkPracticeFormula() {
                    const val = this.userFormulaInput.trim().toLowerCase();
                    if (!val) {
                        this.formulaIsOk = false;
                        this.formulaStatusMsg = this.lang === 'ta'
                            ? '💡 முதலில் சூத்திரத்தை எழுதுங்கள்! உங்களால் முடியும்!'
                            : '💡 Please enter the formula first! You can do it!';
                        return;
                    }
                    const keywords = this.activeShape().formulaKeywords;
                    const hasDigitOrOp = /[0-9×*x]/.test(val);
                    const matched = keywords.some(k => val.includes(k)) || hasDigitOrOp;
                    if (matched) {
                        this.formulaIsOk = true;
                        this.formulaStatusMsg = this.lang === 'ta'
                            ? '🌟 மிக நன்று! சூத்திரம் சரியாக உள்ளது!'
                            : '🌟 Excellent! Great formula setup!';
                        this.playChime([587.33, 783.99]);
                    } else {
                        this.formulaIsOk = false;
                        this.formulaStatusMsg = this.lang === 'ta'
                            ? '💡 மீண்டும் முயற்சி செய்! மேலே உள்ள தங்கச் சூத்திரத்தைப் பாருங்கள்.'
                            : '💡 Try again! Look at the Golden Formula box above.';
                    }
                },

                checkPracticeAnswer() {
                    const num = parseFloat(this.userAnswerInput);
                    const expected = this.activeShape().practice[this.practiceIdx].ansNum;
                    if (isNaN(num)) {
                        this.answerIsOk = false;
                        this.answerStatusMsg = this.lang === 'ta'
                            ? '💡 எண் விடையை உள்ளிடவும்!'
                            : '💡 Please enter a number answer!';
                        return;
                    }
                    if (Math.abs(num - expected) < 0.2) {
                        this.answerIsOk = true;
                        this.answerStatusMsg = this.lang === 'ta'
                            ? '🎉 மிக நன்று! சரியான விடை!'
                            : '🎉 Excellent! Correct answer! You can do it!';
                        this.celebrate();
                    } else {
                        this.answerIsOk = false;
                        this.answerStatusMsg = this.lang === 'ta'
                            ? '💡 மீண்டும் முயற்சி செய்! உங்களால் முடியும்!'
                            : '💡 Try again! Check your multiplication carefully — You can do it!';
                    }
                },

                // Grand Revision Game Methods
                buildRevisionGame() {
                    this.gameScore = 0;
                    this.gameQuestions = this.shapes.map((shape, idx) => {
                        const wrongPool = this.shapes.filter((_, i) => i !== idx);
                        const shuffledWrong = wrongPool.sort(() => 0.5 - Math.random()).slice(0, 2);
                        const options = [
                            { en: shape.formulaEn, ta: shape.formulaTa, isCorrect: true },
                            { en: shuffledWrong[0].formulaEn, ta: shuffledWrong[0].formulaTa, isCorrect: false },
                            { en: shuffledWrong[1].formulaEn, ta: shuffledWrong[1].formulaTa, isCorrect: false }
                        ].sort(() => 0.5 - Math.random());

                        return {
                            shapeId: shape.id,
                            solved: false,
                            feedback: '',
                            options
                        };
                    });
                },

                answerGameQuestion(qIdx, isCorrect) {
                    const q = this.gameQuestions[qIdx];
                    if (q.solved) return;
                    if (isCorrect) {
                        q.solved = true;
                        q.feedback = this.lang === 'ta' ? '🎉 மிக நன்று!' : '🎉 Excellent!';
                        this.gameScore++;
                        this.celebrate();
                    } else {
                        q.feedback = this.lang === 'ta' ? '💡 மீண்டும் முயற்சி செய்!' : '💡 Try again! You can do it!';
                    }
                },

                resetGame() {
                    this.buildRevisionGame();
                },

                // Web Audio API Cheerful Melody & Chimes (No external URLs)
                playChime(freqs = [523.25, 659.25, 783.99, 1046.50]) {
                    try {
                        const AudioCtx = window.AudioContext || window.webkitAudioContext;
                        const ctx = new AudioCtx();
                        const now = ctx.currentTime;
                        freqs.forEach((f, i) => {
                            const osc = ctx.createOscillator();
                            const gain = ctx.createGain();
                            osc.type = 'triangle';
                            osc.frequency.setValueAtTime(f, now + i * 0.11);
                            gain.gain.setValueAtTime(0.16, now + i * 0.11);
                            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.11 + 0.28);
                            osc.connect(gain);
                            gain.connect(ctx.destination);
                            osc.start(now + i * 0.11);
                            osc.stop(now + i * 0.11 + 0.28);
                        });
                    } catch (e) {}
                },

                toggleMusic() {
                    this.musicPlaying = !this.musicPlaying;
                    if (this.musicPlaying) {
                        const melody = [523.25, 587.33, 659.25, 523.25, 659.25, 783.99, 659.25, 587.33];
                        let step = 0;
                        this.playChime([melody[0]]);
                        this.musicInterval = setInterval(() => {
                            step = (step + 1) % melody.length;
                            this.playChime([melody[step]]);
                        }, 650);
                    } else {
                        if (this.musicInterval) clearInterval(this.musicInterval);
                    }
                },

                celebrate() {
                    this.playChime([523.25, 659.25, 783.99, 1046.50]);
                    try {
                        confetti({
                            particleCount: 85,
                            spread: 70,
                            origin: { y: 0.65 }
                        });
                    } catch (e) {}
                }
            };
        }
    </script>
